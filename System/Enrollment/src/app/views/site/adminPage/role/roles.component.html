<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body class="bg-gray-100 text-gray-900">
  <app-header></app-header>

  <app-side-bar></app-side-bar>

  <!-- Main Content -->
  <div class="ml-64 p-8 pt-16 h-[calc(100vh-8rem)] justify-between overflow-auto">
    <div class="flex flex-end justify-between items-center mb-8">
      <h1 class="text-2xl font-bold mb-6">Role List</h1>
      <button (click)="openModal()" class="bg-blue-500 text-white rounded p-2">Add New Role</button>
    </div>
    <div class="flex flex-col lg:flex-row justify-between w-full m-0">
      <table class="min-w-full bg-white">
        <thead>
          <tr>
            <th class="text-left py-2 px-4 border-b">Role Name</th>
            <th class="text-left py-2 px-4 border-b">Status</th>
            <th class="text-center py-2 px-4 border-b">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="py-2 px-4 border-b">Admin</td>
            <td class="py-2 px-4 border-b">Active</td>
            <td class="py-2 px-4 border-b flex flex-row justify-center g-2 text-center">
              <button class="bg-yellow-500 text-white p-2 rounded w-20 mr-2">Edit</button>
              <button class="bg-red-500 text-white p-2 rounded w-20">Delete</button>
            </td>
          </tr>
          <!-- Add more rows as needed -->
        </tbody>
      </table>
    </div>


  <!-- Modal -->
  <div *ngIf="isModalOpen" class="fixed inset-0 bg-gray-500 bg-opacity-75 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
      <h3 class="text-xl font-semibold mb-4">Add New Role</h3>
      <form [formGroup]="roleForm" (ngSubmit)="saveRole()">
        <div class="mb-4">
          <label for="roleName" class="block text-sm font-medium text-gray-700">Role Name</label>
          <input id="roleName" formControlName="roleName" maxlength="40" class="w-full mt-1 p-2 border border-gray-300 rounded-md" type="text" required />
          <div *ngIf="roleForm.get('roleName')?.invalid && roleForm.get('roleName')?.touched" class="text-red-500 text-sm">
            Role Name is required.
          </div>
        </div>
        <div class="mb-4">
          <label for="status" class="block text-sm font-medium text-gray-700">Status</label>
          <select id="status" formControlName="status" class="w-full mt-1 p-2 border border-gray-300 rounded-md" required>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <div class="flex justify-between">
          <button type="button" (click)="closeModal()" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-md mr-2">Cancel</button>
          <button type="submit" [disabled]="roleForm.invalid" class="bg-blue-500 text-white px-4 py-2 rounded-md">Save</button>
        </div>
      </form>
    </div>
  </div>

  <app-footer></app-footer>
