<app-header></app-header>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: url('img/logo.png') no-repeat;
    background-size: cover;
    background-position: center;
    background-color: #f4f4f4;
    padding-top: 80px;
  }

  .forgot {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    max-width: 400px;
    height: auto;
    padding: 15px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  .form-box {
    width: 100%;
    padding: 40px;
  }

  .form-box h2 {
    font-size: 2em;
    color: #162938;
    text-align: center;
  }

  .input-box1 {
    position: relative;
    width: 100%;
    max-width: 300px;
    height: 50px;
    border-bottom: 2px solid #162938;
    margin: 30px 0;
  }

  .input-box1 label {
    position: absolute;
    top: 50%;
    left: 5px;
    transform: translateY(-50%);
    font-size: 1em;
    font-weight: 500;
    pointer-events: none;
    transition: 0.5s;
  }

  .input-box1 input:focus~label,
  .input-box1 input:valid~label {
    top: -5px;
  }

  .input-box1 input {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #162938;
    font-weight: 600;
    padding: 0 35px 0 5px;
  }

  .input-box1 .icon {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: #162938;
  }

  .btn {
    width: 100%;
    height: 45px;
    background: #162938;
    outline: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
    color: #fff;
    font-weight: 500;
    margin-bottom: 5px;
  }

  .loader {
    border: 6px solid #f3f3f3;
    border-top: 6px solid #162938;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {
      transform: rotate(360deg);
    }
  }
</style>
<div class="fixed w-full h-full loginBackground">
  <img src="assets/src/img/site/loginBackground.jpg" class="w-full h-full" alt="">
</div>
<app-header></app-header>
<div class="forgot">
  <div class="form-box">
    <h2>Send Email</h2>
    <form [formGroup]="emailForm" (ngSubmit)="sendEmail()">

      <div class="input-box1">
        <input type="email" id="recipient" formControlName="recipient"
          class="w-full p-2 mt-1 border border-gray-300 rounded-md form-control focus:outline-none focus:ring-2 focus:ring-cyan-500"
          (input)="errorMessage = ''" required>
        <label>Email</label>
        <span class="icon">📧</span>
      </div>
      <div *ngIf="emailForm.get('recipient')?.invalid && emailForm.get('recipient')?.touched"
        class="mt-1 text-sm text-red-500 error">
        A valid email address is required.
      </div>
      <a>
        <button type="submit" [disabled]="emailForm.invalid" class="btn">Send Email</button>
      </a>
      <a [routerLink]="['/auth/login']">
        <button type="button" class="btn online-register-btn">Back to Login</button>
      </a>
    </form>
  </div>
</div>
<div *ngIf="showLoading" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50">
  <div class="p-6 text-center rounded-lg shadow-lg animate-pulse">
    <div class="mb-4 loader"></div>
  </div>
</div>
