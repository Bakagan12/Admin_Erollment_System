<body class="flex justify-center items-center min-h-screen bg-gray-100">
  <header class="bg-blue-600 py-4 fixed top-0 left-0 w-full z-50">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center gap-4">
        <img src="assets/src/img/homepage/images/SCLC.png" alt="Sta. Cruz Learning Center" class="w-12 h-12">
        <h1 class="text-white text-2xl">Sta. Cruz Learning Center</h1>
      </div>
      <nav>
        <ul class="flex gap-4">
          <li><a routerLink="/homepage" class="text-white bg-cyan-800 hover:bg-blue-500 px-4 py-2 rounded">Home</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="flex items-center justify-center min-h-screen mt-10">
    <div class="flex items-center justify-center max-w-[1900px] max-h-[100%] p-6 bg-gradient-to-b from-[#a7c9e7] to-[#69a1d6] rounded-lg shadow-lg">
      <div class="flex flex-col md:flex-row items-center justify-center gap-8" style="width: 600px;">
        <div>
          <img src="assets/src/img/homepage/images/design-removebg-preview.png" alt="Password Reset">
        </div>
        <div class="login-container max-w-md w-full">
          <h1 class="text-4xl font-semibold text-center mb-8 flex flex-1 ">Reset Password</h1>

          <!-- Error message shown if there is an error -->
          <div *ngIf="errorMessage" class="error-message text-red-500 text-center mb-4">
            {{ errorMessage }}
          </div>

          <!-- Reactive Form binding -->
          <form [formGroup]="changePasswordForm" (ngSubmit)="resetPassword()" class="bg-white p-8 rounded shadow-md">
            <!-- Username Input (readonly) -->
            <div id="usernameSection" class="mb-4">
              <label for="username" class="block text-sm font-bold text-gray-700">Username</label>
              <input
                type="text"
                id="username"
                formControlName="username"
                value="username_here"
                readonly
                class="form-control mt-1 p-2 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-500"
              />
            </div>

            <!-- New Password Input -->
            <div id="newPasswordSection" class="mb-4">
              <label for="newPassword" class="block text-sm font-bold text-gray-700">Enter New Password</label>
              <div class="relative">
                <input
                  [type]="passwordVisible ? 'text' : 'password'"
                  id="newPassword"
                  formControlName="newPassword"
                  minlength="5"
                  class="form-control mt-1 p-2 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-500"
                  (input)="errorMessage = ''"
                />
                <i
                  class="fa-solid fa-eye absolute right-3 mt-4 cursor-pointer"
                  [ngClass]="passwordVisible ? 'fa-eye' : 'fa-eye-slash'"
                  (click)="togglePasswordVisibility()"
                ></i>
              </div>
              <div *ngIf="f['newPassword']?.invalid && f['newPassword']?.touched" class="error text-red-500 text-sm mt-1">
                Password is required.
              </div>
            </div>

            <!-- Confirm New Password Input -->
            <div id="confirmPasswordSection" class="mb-4">
              <label for="confirmPassword" class="block text-sm font-bold text-gray-700">Confirm New Password</label>
              <div class="relative">
                <input
                  [type]="passwordVisible ? 'text' : 'password'"
                  id="confirmPassword"
                  formControlName="confirmPassword"
                  minlength="5"
                  class="form-control mt-1 p-2 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-500"
                  (input)="errorMessage = ''"
                />
                <i
                  class="fa-solid fa-eye absolute right-3 mt-4 cursor-pointer"
                  [ngClass]="passwordVisible ? 'fa-eye' : 'fa-eye-slash'"
                  (click)="togglePasswordVisibility()"
                ></i>
              </div>
              <div *ngIf="f['confirmPassword']?.invalid && f['confirmPassword']?.touched" class="error text-red-500 text-sm mt-1">
                Password confirmation is required.
              </div>
            </div>


            <!-- Submit Button -->
            <div class="flex justify-between items-center mb-4">
              <button
                type="submit"
                [disabled]="changePasswordForm.invalid"
                class="w-full bg-blue-600 text-white py-2 rounded-md mt-4 hover:bg-cyan-800 transition">
                Reset Password
              </button>
            </div>

            <!-- Login Button -->
            <div class="text-center mt-4">
              <a [routerLink]="['/login']" class="text-blue-900 hover:text-red-900 font-bold text-lg">Go to Login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
