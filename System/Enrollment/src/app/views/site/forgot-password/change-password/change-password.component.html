<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-color: #f4f4f4;
    padding-top: 80px;
}
.error-message {
  font-size: 0.95rem;
  font-weight: 500;
  color: #e53e3e; /* red */
  margin: 10px 0 20px 0; /* spacing top and bottom */
  padding: 8px 12px;
  background-color: #ffe5e5;
  border: 1px solid #e53e3e;
  border-radius: 8px;
  text-align: center;
}
.forgot {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    max-width: 400px;
    height: auto;
    padding: 15px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
}

.form-box {
    width: 100%;
    padding: 40px;
}

.form-box h2 {
    font-size: 2em;
    color: #162938;
    text-align: center;
}

.input-box1 {
    position: relative;
    width: 100%;
    max-width: 300px;
    height: 50px;
    border-bottom: 2px solid #162938;
    margin: 30px 0;
}

.input-box1 label {
    position: absolute;
    top: 50%;
    left: 5px;
    transform: translateY(-50%);
    font-size: 1em;
    font-weight: 500;
    pointer-events: none;
    transition: 0.5s;
}

.input-box1 input:focus ~ label,
.input-box1 input:valid ~ label {
    top: -5px;
}

.input-box1 input {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #162938;
    font-weight: 600;
    padding: 0 35px 0 5px;
}

.input-box1 .icon {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: #162938;
}

.btn {
    width: 100%;
    height: 45px;
    background: #162938;
    outline: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
    color: #fff;
    font-weight: 500;
    margin-bottom: 5px;
}
    </style>
</head>
<body>
  <div class="loginBackground fixed h-full w-full">
    <img src="assets/src/img/site/loginBackground.jpg" class="h-full w-full" alt="">
  </div>
  <app-header></app-header>
    <div class="forgot">
        <div class="form-box">
            <h2>Reset Password</h2>
            <!-- <p *ngIf="username">Hello, <strong>{{ email }}</strong>! Please change your password below. -->
              <!-- <strong>{{change_pass_code}}</strong> -->
            <!-- </p> -->
            <div *ngIf="errorMessage" class="error-message">
              {{ errorMessage }}
            </div>
            <form  (ngSubmit)="onChangePassword()" #changePassForm="ngForm">

              <div class="relative w-full max-w-xs border-b-2 border-[#162938]">
                <input type="text" name="username"
                  class="w-full h-12 bg-transparent outline-none text-center text-[#162938] font-semibold pl-5 pr-10"
                  [value]="username" [disabled]="true" required />
                <span class="absolute top-[-0.5rem] left-1 text-xs text-center text-[#162938] px-1">Username</span>
                <span class="absolute top-1/2 right-2 transform -translate-y-1/2 text-xl text-[#162938]">👤</span>
              </div>
                <div class="input-box1">
                    <input type="password" name="newPassword"  [(ngModel)]="newPassword" required>
                    <label>New Password</label>
                    <span class="icon">🔑</span>

                </div>

                <div class="input-box1">
                    <input type="password" name="confirm_newPassword"  [(ngModel)]="confirm_newPassword" required>
                    <label>Confirm Password</label>
                    <span class="icon">✅</span>
                </div>
                  <!-- <div *ngIf="errorMessage" class="text-red-600 text-sm mb-6">
                    {{ errorMessage }}
                  </div> -->
                <a>
                <button type="submit" class="btn hover:opacity-85">Update Password</button>
                </a>
                <a [routerLink]="['/auth/login']">
                    <button type="button" class="btn online-register-btn hover:opacity-85">Back to Login</button>
                </a>
            </form>
        </div>
    </div>
