<body class="justify-center items-center">
  <header class="bg-blue-600 py-4 fixed top-0 left-0 w-full z-50">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center gap-4">
        <img src="assets/src/img/homepage/images/SCLC.png" alt="Sta. Cruz Learning Center" class="w-12 h-12">
        <h1 class="text-white text-2xl">Sta. Cruz Learning Center</h1>
      </div>
      <nav>
        <ul class="flex gap-4">
          <li><a routerLink="/homepage" class="text-white bg-cyan-800 hover:bg-blue-500 px-4 py-2 rounded">Home</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <div class="min-h-screen flex items-center justify-center mt-10 ">
    <div class="flex items-center justify-center max-w-[1900px] max-h-[100%] p-6 bg-gradient-to-b from-[#a7c9e7] to-[#69a1d6] rounded-lg shadow-lg">
      <div class="flex flex-col md:flex-row items-center justify-center gap-8" style="width: 600px;">
        <div>
          <img src="assets/src/img/homepage/images/design-removebg-preview.png" alt="">
        </div>
        <div class="login-container max-w-md w-full">
          <h1 class=" flex flex-2 ml-20 text-4xl font-semibold text-center mb-6">Login</h1>

          <!-- Error message shown if there is an error -->
          <div *ngIf="errorMessage" class="error-message text-red-500 text-center mb-4">
            {{ errorMessage }}
          </div>

          <!-- Reactive Form binding -->
          <form [formGroup]="loginForm" (ngSubmit)="login()" class="bg-white p-8 max-h[50%] rounded">
            <!-- Username Input -->
            <div id="usernameSection" class="mb-4">
              <label for="username" class="block text-sm font-bold text-gray-700">Username</label>
              <input
                type="text"
                id="username"
                maxlength="40"
                formControlName="username"
                class="form-control mt-1 p-2 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-500"
                (input)="errorMessage = ''"
              />
              <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error text-red-500 text-sm mt-1">
                Username is required.
              </div>
            </div>

            <!-- Password Input -->
            <div id="passwordSection" class="mb-4">
              <label for="password" class="block text-sm font-bold text-gray-700">Password</label>
              <div class="relative">
                <input
                  [type]="passwordVisible ? 'text' : 'password'"
                  id="password"
                  maxlength="40"
                  minlength="5"
                  formControlName="password"
                  class="form-control mt-1 p-2 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-500"
                  (input)="errorMessage = ''"
                />
                <i
                  class="fa-solid fa-eye absolute right-3 mt-4 cursor-pointer"
                  [ngClass]="passwordVisible ? 'fa-eye' : 'fa-eye-slash'"
                  (click)="togglePasswordVisibility()"
                ></i>
              </div>
              <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error text-red-500 text-sm mt-1">
                Password is required.
              </div>
            </div>

            <!-- Forgot Password and Login Row -->
            <div class="flex justify-between items-center mb-4">
              <!-- Forgot Password Link -->
              <a [routerLink]="['/forgot/password']" class="text-blue-900 hover:text-red-900 font-bold  text-lg mt-3">Forgot Password?</a>
              <!-- Login Button -->
              <button
                type="submit"
                id="login-btn"
                [disabled]="loginForm.invalid"
                class="w-1/2 bg-blue-600 text-white py-2 rounded-md mt-4 hover:bg-cyan-800 transition">
                Login
              </button>
            </div>

            <!-- Online Enrollment Button -->
            <button
              type="button"
              (click)="goToOnlineRegistration()"
              class="w-full bg-blue-600 text-white py-2 rounded-md mt-4 hover:bg-cyan-800 transition">
              Don't have an account? Register here.
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- <app-footer></app-footer> -->
</body>
