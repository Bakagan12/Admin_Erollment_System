<div *ngIf="showModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white p-6 rounded-lg w-full max-w-sm shadow-lg">
    <h2 class="text-xl font-semibold mb-2 text-center">{{ title }}</h2>
    <p class="text-gray-700 mb-4">{{ message }}</p>

    <div class="flex justify-between gap-3">
      <button class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded" (click)="cancel()">
        {{ cancelText }}
      </button>
      <button class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded" (click)="confirm()">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
